name: Publish to npm

# Publishes @inandu-solutions/grid-angular to npm via trusted publishing (OIDC) — no npm token and
# no 2FA prompt, and the package gets a provenance attestation.
#
# Runs on a pushed v* tag, or manually (Actions > Publish to npm > Run workflow) with the version
# typed in.
#
# One-time setup, on npmjs.com > the package > Settings > Trusted Publisher > GitHub Actions:
#   Organization or user: inandusolutions
#   Repository:           inandu-grid
#   Workflow filename:    publish.yml
#
# Release flow (see PUBLISHING.md): bump "version" in projects/inandu-grid/package.json, update
# CHANGELOG.md, merge, then `git tag vX.Y.Z && git push origin vX.Y.Z` from main.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish — must match "version" in projects/inandu-grid/package.json (e.g. 1.3.0)'
        required: true

permissions:
  contents: read
  id-token: write   # required for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PKG_VERSION=$(node -p "require('./projects/inandu-grid/package.json').version")
          echo "publishing=$VERSION  package.json=$PKG_VERSION"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version $VERSION does not match \"version\": \"$PKG_VERSION\" in projects/inandu-grid/package.json — bump it first."
            exit 1
          fi

      # Node 22 ships npm 10.x; trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm >= 11.5.1 is required for trusted publishing'); process.exit(1); }" "$(npm --version)"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (library)
        run: npm run test:lib -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build library
        run: npm run build:lib

      # Publish from dist/inandu-grid, never the repo root (the root package.json is the private workspace).
      - name: Check the built package
        working-directory: dist/inandu-grid
        run: |
          NAME=$(npm pkg get name | tr -d '"')
          BUILT=$(npm pkg get version | tr -d '"')
          echo "built $NAME@$BUILT"
          [ "$NAME" = "@inandu-solutions/grid-angular" ] || { echo "::error::unexpected package name $NAME"; exit 1; }
          [ "$BUILT" = "$(node -p "require('../../projects/inandu-grid/package.json').version")" ] || { echo "::error::dist version $BUILT differs from source"; exit 1; }

      - name: Publish (provenance)
        working-directory: dist/inandu-grid
        run: npm publish --provenance --access public
