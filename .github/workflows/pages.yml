name: Pages

# Builds the demo app + bundles the user manual, deploys to GitHub Pages.
#   https://inandusolutions.github.io/inandu-grid/            -> the live demo
#   https://inandusolutions.github.io/inandu-grid/manual.html -> the user manual
#
# Pages "Source" must be set to "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build library + demo
        run: npm run build -- --base-href=/inandu-grid/

      - name: Assemble the site
        run: |
          SRC=dist/grid-app/browser
          [ -d "$SRC" ] || SRC=dist/grid-app
          mkdir _site
          cp -r "$SRC"/. _site/
          cp docs/*.html docs/screenshot.png _site/
          cp _site/index.html _site/404.html   # SPA fallback

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
