name: CI

# Assumes this repo's root is the Angular workspace (package.json, angular.json
# at the top level) — i.e. the contents of `grid-app/` from the development
# monorepo. If the workspace lives in a subdirectory, add `defaults.run.working-directory`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # What the repo supports is written once, in support-matrix.json: package.json, .nvmrc, this workflow and the README must agree with it.
      - name: Check the support matrix
        run: npm run check:support

      - name: Lint
        run: npm run lint

      - name: Build library
        run: npm run build:lib

      # The published .d.ts must type-check on its own, with skipLibCheck off, the way a strict consumer sees it. (1.3.0 and 1.4.0
      # shipped declarations that used an `index_d_exports` namespace they never defined: every core type became `any`.)
      - name: Check the generated declarations
        run: npm run check:dts

      # The exported API (names, kinds, members, types) is a committed snapshot: a removed or retyped export shows up in the pull
      # request. After an intended change run `npm run build:lib && npm run api:update` and commit api/public-api.txt.
      - name: Check the public API snapshot
        run: npm run api:check

      # jspdf stays on-demand, size budgets, tarball contents and entry points (scripts/check-package.mjs).
      - name: Check the package
        run: npm run check:package
      - name: Unit tests (library)
        run: npm run test:lib -- --watch=false --browsers=ChromeHeadlessCI

      - name: Unit tests (demo app)
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build (library + app)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # The Chromium/apt download occasionally stalls on GitHub's runners; fail fast instead of hanging.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # No --with-deps: that pulls ~a dozen font packages through apt, and the Ubuntu mirror is
        # sometimes slow enough to stall the job for 10+ minutes. The runner image already ships the
        # libraries Chromium needs; the fonts only affect screenshots, which these specs don't take.
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: E2E tests
        # playwright.config.ts's webServer builds the library and serves the demo on :4202.
        run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The differential corpus must be identical in every repo that runs it (see the test that reads it). The canonical copy
  # is inandu-grid-extensions tests/Inandu.Grid.Extensions.Tests/Contract/diff-corpus.json, pinned by EXT_REF. Until EXT_REF
  # points at a commit that has the file, the check only says so; bump EXT_REF when the Extensions change is merged.
  corpus-sync:
    runs-on: ubuntu-latest
    env:
      EXT_REF: 7b1b60b16683b64534f6195933d5c786ed1dbe60    # inandusolutions/inandu-grid-extensions v0.8.0
      CORPUS: projects/inandu-grid/src/lib/contract/diff-corpus.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inandusolutions/inandu-grid-extensions
          ref: ${{ env.EXT_REF }}
          path: _upstream/extensions

      - name: Compare diff-corpus.json with inandu-grid-extensions
        run: |
          UPSTREAM=_upstream/extensions/tests/Inandu.Grid.Extensions.Tests/Contract/diff-corpus.json
          if [ ! -f "$UPSTREAM" ]; then
            echo "::notice::EXT_REF has no diff-corpus.json yet: bump EXT_REF once the Extensions change is merged."
            exit 0
          fi
          diff -u <(sed 's/\r$//' "$UPSTREAM") <(sed 's/\r$//' "$CORPUS")

  # Firefox, WebKit and a touch device (the main e2e job is Chromium only).
  e2e-cross-browser:
    name: e2e ${{ matrix.project }}
    runs-on: ubuntu-latest
    # The official Playwright image already has the system libraries WebKit and Firefox need, so nothing is installed with apt. On
    # 2026-11-19 `playwright install --with-deps` took 10+ minutes and timed out on every runner image (the Ubuntu mirrors the
    # runners were given downloaded a few packages a minute). Keep the tag equal to the @playwright/test version in package-lock.json;
    # the browsers themselves are still fetched by `playwright install` below, so a patch difference is harmless.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        # System libraries come from the container image; this only downloads the browser build for the installed Playwright version.
        timeout-minutes: 10
        run: npx playwright install ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}

      - name: E2E tests
        # Firefox refuses to start as root when $HOME belongs to another user, which is the case in the container (Playwright's own advice).
        env:
          HOME: /root
        run: npx playwright test --project=${{ matrix.project }} --workers=2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Installs the packed tarball into an empty project and compiles a consumer against it (scripts/smoke-package.mjs).
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Smoke test the packed package
        run: npm run smoke:package