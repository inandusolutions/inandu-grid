name: CI

# Assumes this repo's root is the Angular workspace (package.json, angular.json
# at the top level) — i.e. the contents of `grid-app/` from the development
# monorepo. If the workspace lives in a subdirectory, add `defaults.run.working-directory`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build library
        run: npm run build:lib

      # The published .d.ts must type-check on its own, with skipLibCheck off, the way a strict consumer sees it. (1.3.0 and 1.4.0
      # shipped declarations that used an `index_d_exports` namespace they never defined: every core type became `any`.)
      - name: Check the generated declarations
        run: npm run check:dts

      - name: Unit tests (library)
        run: npm run test:lib -- --watch=false --browsers=ChromeHeadlessCI

      - name: Unit tests (demo app)
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build (library + app)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # The Chromium/apt download occasionally stalls on GitHub's runners; fail fast instead of hanging.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # No --with-deps: that pulls ~a dozen font packages through apt, and the Ubuntu mirror is
        # sometimes slow enough to stall the job for 10+ minutes. The runner image already ships the
        # libraries Chromium needs; the fonts only affect screenshots, which these specs don't take.
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: E2E tests
        # playwright.config.ts's webServer builds the library and serves the demo on :4202.
        run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The differential corpus must be identical in every repo that runs it (see the test that reads it). The canonical copy
  # is inandu-grid-extensions tests/Inandu.Grid.Extensions.Tests/Contract/diff-corpus.json, pinned by EXT_REF. Until EXT_REF
  # points at a commit that has the file, the check only says so; bump EXT_REF when the Extensions change is merged.
  corpus-sync:
    runs-on: ubuntu-latest
    env:
      EXT_REF: 7298765488cbdf8fffea663498c059ffef26d871    # inandusolutions/inandu-grid-extensions
      CORPUS: projects/inandu-grid/src/lib/contract/diff-corpus.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inandusolutions/inandu-grid-extensions
          ref: ${{ env.EXT_REF }}
          path: _upstream/extensions

      - name: Compare diff-corpus.json with inandu-grid-extensions
        run: |
          UPSTREAM=_upstream/extensions/tests/Inandu.Grid.Extensions.Tests/Contract/diff-corpus.json
          if [ ! -f "$UPSTREAM" ]; then
            echo "::notice::EXT_REF has no diff-corpus.json yet: bump EXT_REF once the Extensions change is merged."
            exit 0
          fi
          diff -u <(sed 's/\r$//' "$UPSTREAM") <(sed 's/\r$//' "$CORPUS")

  # Firefox, WebKit and a touch device (the main e2e job is Chromium only).
  e2e-cross-browser:
    name: e2e ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        # WebKit and Firefox need system libraries the runner image does not all ship, hence --with-deps here.
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}

      - name: E2E tests
        run: npx playwright test --project=${{ matrix.project }} --workers=2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
