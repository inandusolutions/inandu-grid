version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      angular:
        patterns:
          - "@angular*"
          - "@angular-devkit/*"
          - ng-packagr
          - zone.js
      dev-minor-patch:
        dependency-type: development
        # Angular tooling (@angular/build, cli, compiler-cli) peer-pins the exact
        # @angular/compiler version, so it must move with the angular group.
        exclude-patterns:
          - "@angular*"
          - "@angular-devkit/*"
          - ng-packagr
          - zone.js
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
